name: Cyclone Robotics
description: 'Cyclone Robotics is an enterprise Robotic Process Automation (RPA) and
  hyperautomation platform provider serving large organizations across Asia. Its product
  suite spans RPA Studio, RPA Robot and RPA Controller for building and orchestrating
  software robots; AI capabilities including AI Skill Studio, Task Intelligence, Process
  Intelligence, Intelligent Document Processing (IDP) and chatbots; and delivery options
  such as Robot-as-a-Service and RPA Mobile. The platform lets business and technical
  users automate finance, government, manufacturing, banking, insurance, logistics,
  healthcare and customer-service processes, and can expose robot business functions
  as callable services (RaaS) for third-party integration. Surfaced as a portfolio
  company of dcm-ventures and profiled in the API Evangelist network.'
